version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      # @vitest/coverage-v8 pins vitest to its exact version, so the two only install when
      # they move together, majors included. Listed first because a dependency joins the
      # first group it matches.
      vitest:
        patterns: ['vitest', '@vitest/*']
      npm:
        patterns: ['*']
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']

  # Dependabot has no security updates for OpenTofu, so only version updates are grouped.
  - package-ecosystem: opentofu
    directory: /iac
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      opentofu:
        patterns: ['*']
        update-types: [minor, patch]
