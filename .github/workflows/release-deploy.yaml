name: Release and deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - 'iac/**'
      - '.github/workflows/iac-*.yaml'
permissions:
  contents: write
jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yaml
  release:
    name: Tag and release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Set up semantic-release
        run: |
          # Pinned: 10.x renders through conventional-changelog-writer@9, but
          # semantic-release still bundles release-notes-generator on writer@8.
          npm install --no-save \
          semantic-release \
          @semantic-release/exec \
          conventional-changelog-conventionalcommits@9.3.1
      - name: Publish release and tag
        id: semantic-release
        run: |
          npx semantic-release
          if [ -f .new-semantic-release-version ]; then
            echo "new-release-published=true" >> "$GITHUB_OUTPUT"
            rm .new-semantic-release-version
          else
            echo "new-release-published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      new-release-published: ${{ steps.semantic-release.outputs.new-release-published }}
  deploy:
    name: Deploy
    needs: release
    if: needs.release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
